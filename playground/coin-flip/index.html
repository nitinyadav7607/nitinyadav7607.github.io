<!DOCTYPE html>
<html>
  <head>
    <title>Coin Toss Game</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles/coin-flip.css">
  </head>

  <bodY>
    <!-- Back to website (added for the Playground) -->
    <style>body{padding-top:44px}</style>
    <a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#ffffff;color:#0f2a3a;font:600 14px/1 system-ui,-apple-system,'Segoe UI',sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25);">&larr; Playground</a>


    <div class="body-of-game">

      <div class="box">

        <div>
          <u>Click on Toss button</u>

          <div class="flip-coin-box">

            <img class="flip-coin" src="images/front.png" id = 'imageChange'>

            <button class="toss-button" onclick="flipCoin()">Toss</button>
          </div>

        </div>
  
        <div>
          <u>Choose you side</u>

          <div class="user-choice-box">

            <img class="front-side" src="images/front.png" onclick="coinSide('head')">

            <button class="reset-button" onclick="resetButton()">Reset Score</button>

            <img class="back-side" src="images/back.png" onclick="coinSide('tail')">

          </div>
           
        </div>
  
      </div>
    </div>


    <script src="script/script.js"></script>
    
  </bodY>
</html>
